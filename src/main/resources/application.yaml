server:
  port: 8080

app:
  name: "Task Manager Application"
  version: "1.0.0"
  description: "Homework"
  created-by: "Tim"
  upload:
    dir: uploads

api:
  version: "2.0.0"

logging:
  level:
    com.mipt.hw: DEBUG

spring:
  application:
    name: HW2ndSem
  jpa:
      hibernate:
        ddl-auto: validate
      show-sql: false
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
          jdbc:
            batch_size: 20
  flyway:
      enabled: true
      baseline-on-migrate: true
      locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  show-actuator: true

  profiles:
    active: dev