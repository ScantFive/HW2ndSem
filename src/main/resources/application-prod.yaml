server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
  flyway:
    enabled: true

app:
  name: "Task Manager Application"
  version: "1.0.0"
  upload:
    dir: ${UPLOAD_DIR:/app/uploads}

logging:
  level:
    com.mipt.hw: WARN
    org.springframework: WARN
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30